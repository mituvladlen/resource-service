# Local stack: PostgreSQL (named volume) + resource-service.
# Credentials come from .env (gitignored). Start: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - resource_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  resource-service:
    build: .
    image: ${DOCKERHUB_USER:-local}/resource-service:1.0.0
    env_file: .env
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  resource_pgdata:
